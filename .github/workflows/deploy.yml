name: Verify and deploy to Render

on:
  pull_request:
  push:
    branches: [main, integration/render-supabase-phase3]
  workflow_dispatch:
    inputs:
      target:
        description: Render environment
        type: choice
        required: true
        options: [staging, prod]
        default: staging

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - name: Backend tests and runtime dependency audit
        working-directory: backend
        run: |
          npm ci
          node --test test/*.test.cjs
          npm audit --omit=dev --audit-level=high
      - name: Worker tests and runtime dependency audit
        working-directory: worker
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          pipx run --spec pip-audit==2.9.0 pip-audit --strict -r requirements.txt
      - name: Frontend config build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://example.com
          VITE_ENTRA_TENANT_ID: 10000000-0000-0000-0000-000000000001
          VITE_ENTRA_CLIENT_ID: 10000000-0000-0000-0000-000000000002
          VITE_ENTRA_API_SCOPE: api://10000000-0000-0000-0000-000000000003/access_as_user
        run: node build-config.cjs
      - name: Validate Render infrastructure
        run: |
          terraform -chdir=infra/render fmt -check -diff
          terraform -chdir=infra/render init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/render validate
      - name: Scan tracked files for secrets
        run: |
          snapshot=$(mktemp -d)
          trap 'rm -rf "$snapshot"' EXIT
          git archive HEAD | tar -x -C "$snapshot"
          docker run --rm -v "$snapshot:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.24.3 dir --redact --no-banner /repo
      - name: Check deploy script syntax
        run: node --check .github/scripts/deploy-render.cjs

  deploy:
    needs: ci
    if: >-
      (github.ref == 'refs/heads/integration/render-supabase-phase3' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging'))) ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment: ${{ inputs.target || 'staging' }}
    concurrency:
      group: render-${{ inputs.target || 'staging' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Report when deployment is disabled
        if: vars.RENDER_DEPLOY_ENABLED != 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo 'Set RENDER_DEPLOY_ENABLED=true in the GitHub environment after configuring Render.'
          if [[ "$EVENT" == workflow_dispatch ]]; then exit 1; fi
      - uses: actions/checkout@v5
        if: vars.RENDER_DEPLOY_ENABLED == 'true'
      - uses: actions/setup-node@v4
        if: vars.RENDER_DEPLOY_ENABLED == 'true'
        with:
          node-version: '24'
      - name: Deploy this commit and check services
        if: vars.RENDER_DEPLOY_ENABLED == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_BRANCH: ${{ vars.RENDER_DEPLOY_BRANCH }}
          RENDER_BACKEND_ID: ${{ vars.RENDER_BACKEND_ID }}
          RENDER_WORKER_ID: ${{ vars.RENDER_WORKER_ID }}
          RENDER_FRONTEND_ID: ${{ vars.RENDER_FRONTEND_ID }}
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          RENDER_WORKER_URL: ${{ vars.RENDER_WORKER_URL }}
          RENDER_FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
        run: node .github/scripts/deploy-render.cjs
